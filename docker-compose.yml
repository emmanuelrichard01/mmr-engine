# docker-compose.yml — MMR (Money Movement Reconciliation) engine, local stack
#
#   make up            start everything (migrations run automatically)
#   make demo-full     start + synthetic data + matching + verification
#
# All credentials come from .env (copy .env.example). Data ports are bound to
# 127.0.0.1 only; nothing here is meant to be exposed beyond your machine.

name: mmr-engine

x-app-env: &app-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_AUTH_DISABLED: ${API_AUTH_DISABLED:-false}
  POSTGRES_PIPELINE_DSN: postgresql+asyncpg://reconciliation_pipeline:${RECON_PIPELINE_PASSWORD}@postgres:5432/reconciliation
  POSTGRES_API_DSN: postgresql+asyncpg://reconciliation_api_user:${RECON_API_PASSWORD}@postgres:5432/reconciliation
  POSTGRES_READONLY_DSN: postgresql+asyncpg://reconciliation_readonly:${RECON_READONLY_PASSWORD}@postgres:5432/reconciliation
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
  FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY}
  FLUTTERWAVE_SECRET_HASH: ${FLUTTERWAVE_SECRET_HASH}
  PII_TOKENIZATION_KEY: ${PII_TOKENIZATION_KEY}
  FX_PROVIDER_API_KEY: ${FX_PROVIDER_API_KEY:-}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  image: mmr-engine:local
  restart: unless-stopped
  networks: [mmr]

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: reconciliation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      RECON_PIPELINE_PASSWORD: ${RECON_PIPELINE_PASSWORD}
      RECON_API_PASSWORD: ${RECON_API_PASSWORD}
      RECON_READONLY_PASSWORD: ${RECON_READONLY_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/01_init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reconciliation"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [mmr]

  # ── Redpanda (Kafka API) ─────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v23.3.21
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [mmr]

  redpanda_init:
    image: redpandadata/redpanda:v23.3.21
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        set -e;
        for t in raw.paystack.events:3 raw.flutterwave.events:3 raw.polling.fallback:1 dead.letter.queue:1; do
          rpk topic create $${t%%:*} -p $${t##*:} --brokers redpanda:9092 || rpk topic describe $${t%%:*} --brokers redpanda:9092 >/dev/null;
        done;
        echo 'Kafka topics ready'
      "
    networks: [mmr]

  redpanda_console:
    image: redpandadata/console:v2.7.2
    restart: unless-stopped
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
    volumes:
      - ./infra/redpanda/console_config.yml:/tmp/config.yml:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redpanda: { condition: service_healthy }
    networks: [mmr]

  # ── MinIO (Bronze object store) ──────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [mmr]

  minio_init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb --ignore-existing local/reconciliation-bronze
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks: [mmr]

  # ── Migrations (one-shot, as the database owner) ─────────────────────────
  migrations:
    <<: *app
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/reconciliation
    depends_on:
      postgres: { condition: service_healthy }

  # ── API ──────────────────────────────────────────────────────────────────
  api:
    <<: *app
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrations: { condition: service_completed_successfully }
      redpanda_init: { condition: service_completed_successfully }
      minio_init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ── Consumer: Kafka → Bronze (MinIO) → Silver ────────────────────────────
  consumer_worker:
    <<: *app
    command: ["python", "-m", "src.flows.consumer_worker"]
    environment:
      <<: *app-env
    depends_on:
      migrations: { condition: service_completed_successfully }
      redpanda_init: { condition: service_completed_successfully }
      minio_init: { condition: service_completed_successfully }

  # ── Scheduler: matching, FX, gap detection, daily return ─────────────────
  scheduler:
    <<: *app
    command: ["python", "-m", "src.flows.scheduler"]
    environment:
      <<: *app-env
      PREFECT_API_URL: http://prefect_server:4200/api
    depends_on:
      migrations: { condition: service_completed_successfully }
      prefect_server: { condition: service_healthy }

  # ── Prefect server (flow-run history UI) ─────────────────────────────────
  prefect_server:
    image: prefecthq/prefect:3-python3.12
    restart: unless-stopped
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/prefect
      PREFECT_UI_API_URL: http://localhost:4200/api
    ports:
      - "127.0.0.1:4200:4200"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [mmr]

  # ── Dashboard (Next.js) ──────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Server-side only: the browser talks to /api/mmr/*, never to the API
      # directly, so the key is never shipped to the client.
      MMR_API_URL: http://api:8000
      MMR_API_KEY: ${DASHBOARD_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api: { condition: service_healthy }
    networks: [mmr]

volumes:
  postgres_data:
  redpanda_data:
  minio_data:

networks:
  mmr:
    name: mmr
