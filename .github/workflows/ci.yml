name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Real PostgreSQL for the `db` tests (fresh database created per run).
      MMR_TEST_DATABASE_URL: postgresql://postgres:ci_password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install
        run: uv venv && uv pip install -e ".[test,dev]"

      - name: Ruff
        run: |
          .venv/bin/ruff check src/ tests/
          .venv/bin/ruff format --check src/ tests/

      - name: mypy (strict)
        run: .venv/bin/mypy src/

      - name: Security scanner
        run: .venv/bin/python scripts/security_check.py

      - name: Tests (unit, contract, database)
        run: .venv/bin/python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=xml

      - name: Dependency audit
        run: uvx pip-audit --skip-editable

  docker:
    name: Container build + compose validation
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime -t mmr-engine:ci .
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet

  dashboard:
    name: Dashboard — lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
