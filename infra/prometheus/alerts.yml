# Alert rules. Every expression references a metric that the code records
# (src/observability/metrics.py); thresholds are starting points to tune.

groups:
  - name: mmr.ingestion
    rules:
      - alert: WebhookSignatureFailures
        expr: sum by (psp_name) (rate(reconciliation_webhook_signature_failures_total[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Webhooks with invalid signatures from {{ $labels.psp_name }}"
          description: "Misconfigured secret, or someone probing the endpoint."

      - alert: EventsDeadLettered
        expr: increase(reconciliation_dead_lettered_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Events parked in the dead-letter topic"
          description: "Inspect dead.letter.queue; each message carries the original bytes and the error."

      - alert: ProcessDown
        expr: up{job=~"mmr-.*"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} is not being scraped"

  - name: mmr.reconciliation
    rules:
      - alert: OpenExposureHigh
        expr: sum by (psp_name) (reconciliation_open_exposure_ngn) > 500000
        labels: { severity: critical }
        annotations:
          summary: "Open exposure above NGN 500,000 on {{ $labels.psp_name }}"
          description: "Current: NGN {{ $value | humanize }}"

      - alert: CriticalDiscrepanciesOpen
        expr: sum(reconciliation_open_discrepancies{severity="critical"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Critical discrepancies open for over 30 minutes"

      - alert: MatchRateLow
        expr: reconciliation_match_rate_pct < 90
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "7-day match rate below 90% on {{ $labels.psp_name }}"

      - alert: WebhookGapsRecovered
        expr: increase(reconciliation_backfill_records_total{outcome="new"}[6h]) > 10
        labels: { severity: warning }
        annotations:
          summary: "Gap detection recovered missed webhooks from {{ $labels.psp_name }}"
          description: "Webhook delivery from the PSP is unreliable; check the PSP dashboard."

  - name: mmr.fx
    rules:
      - alert: FXRateStale
        expr: reconciliation_fx_rate_age_seconds > 7200
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.currency_pair }} rate not refreshed for 2h"

  - name: mmr.api
    rules:
      - alert: ApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(reconciliation_http_request_duration_seconds_bucket{route!="unmatched"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1s"
